name: Build AX1800 Pro 2G daed

# 京东云亚瑟 AX1800 Pro (jdcloud,re-ss-01 / IPQ6000)
# 1GB 内存（硬改 + 1G CDT）+ rootfs2048M/HLOS12M 大分区 + dae/daed 旁路由

on:
  workflow_dispatch:
    inputs:
      note:
        description: "可选：本次构建备注（会写进 Release 说明）"
        required: false
        default: ""
      only:
        description: "调试用：只构建某个目标，例如 package/kernel/bpf-headers/compile（留空则完整编译）"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "config/**"
      - "scripts/**"
      - ".github/workflows/**"
  schedule:
    - cron: "17 19 * * *"   # 每天 UTC 19:17 = 北京时间 03:17 检查一次上游

permissions:
  contents: write

env:
  SOURCE_REPO: https://github.com/fanchmwrt/fanchmwrt-snapshot.git
  SOURCE_BRANCH: fanchmwrt-26.11
  CONFIG_FILE: config/ax1800pro-2g-daed.config
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: build-ax1800pro
  cancel-in-progress: false

jobs:
  build:
    name: 编译固件
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 解析上游 SHA / 判断是否需要构建
        id: up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA=$(git ls-remote "$SOURCE_REPO" "refs/heads/$SOURCE_BRANCH" | cut -f1)
          SHORT=${SHA:0:7}
          echo "sha=$SHA"           >> "$GITHUB_OUTPUT"
          echo "short=$SHORT"       >> "$GITHUB_OUTPUT"
          echo "tag=v$(date -u +%Y%m%d)-$SHORT" >> "$GITHUB_OUTPUT"
          echo "上游 $SOURCE_BRANCH = $SHA"
          SKIP=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if gh release list -R "$GITHUB_REPOSITORY" --limit 30 2>/dev/null | grep -q -- "-$SHORT"; then
              SKIP=true
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "本次是否跳过: $SKIP"

      - name: 释放磁盘空间
        if: steps.up.outputs.skip != 'true'
        run: |
          set -x
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/lib/node_modules /opt/az /usr/lib/mono || true
          sudo apt-get -qq purge -y snapd || true
          df -h /

      - name: 安装编译依赖
        if: steps.up.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get -y -qq install \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev libelf-dev dwarves cmake \
            python3 python3-setuptools rsync unzip zlib1g-dev file wget curl \
            swig time ccache

      - name: 克隆 fanchmwrt 源码
        if: steps.up.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$SOURCE_BRANCH" "$SOURCE_REPO" openwrt
          cd openwrt
          echo "实际检出提交：$(git rev-parse HEAD)"
          echo "提交时间：$(git log -1 --format=%cd)"

      - name: DIY 第一步（feed + 大内核分区补丁）
        if: steps.up.outputs.skip != 'true'
        working-directory: openwrt
        run: bash ../scripts/diy-part1.sh

      - name: 更新并安装 feeds
        if: steps.up.outputs.skip != 'true'
        working-directory: openwrt
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "--- 关键包是否可见 ---"
          for p in daed dae luci-app-daede v2ray-geoip v2ray-geosite; do
            if [ -d "package/feeds/daede/$p" ] || [ -d "package/$p" ] || [ -d "feeds/daede/$p" ]; then
              echo "OK   $p"
            else
              echo "MISS $p"
            fi
          done

      - name: DIY 第二步（旁路由默认配置 + 定制）
        if: steps.up.outputs.skip != 'true'
        working-directory: openwrt
        run: bash ../scripts/diy-part2.sh

      - name: 生成 .config 并校验
        if: steps.up.outputs.skip != 'true'
        working-directory: openwrt
        run: |
          set -euo pipefail
          cp "../$CONFIG_FILE" .config
          make defconfig
          bash ../scripts/verify-config.sh
          grep -E "CONFIG_TARGET_PROFILE|CONFIG_PACKAGE_daed=|CONFIG_PACKAGE_dae=|CONFIG_PACKAGE_luci-app-daede=" .config

      - name: 预下载源码包
        if: steps.up.outputs.skip != 'true'
        working-directory: openwrt
        run: |
          make -j8 download || make -j1 download || true

      - name: 编译固件
        if: steps.up.outputs.skip != 'true'
        working-directory: openwrt
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          set -o pipefail
          if [ -n "${ONLY:-}" ]; then
            echo ">>> 只构建：$ONLY（调试模式，-j1 V=s）"
            make -j1 V=s "$ONLY" 2>&1 | tee build.log
          else
            make -j"$(nproc)" 2>&1 | tee build.log
          fi

      - name: 失败诊断（打印包级日志）
        if: failure() && steps.up.outputs.skip != 'true'
        working-directory: openwrt
        run: |
          echo "===== logs 目录 ====="
          find logs -name '*.txt' -type f 2>/dev/null | tail -n 40 || true
          for f in $(find logs -name '*.txt' -type f 2>/dev/null); do
            if grep -qiE 'error|not found|No such file|failed' "$f"; then
              echo ""
              echo "########## $f ##########"
              tail -n 80 "$f"
            fi
          done

      - name: 上传编译日志（失败时）
        if: failure() && steps.up.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ steps.up.outputs.short }}
          path: |
            openwrt/build.log
            openwrt/logs
          retention-days: 7

      - name: 校验产物（BTF / 包 / 镜像大小）
        if: steps.up.outputs.skip != 'true' && github.event.inputs.only == ''
        working-directory: openwrt
        run: bash ../scripts/verify-image.sh

      - name: 收集固件
        if: steps.up.outputs.skip != 'true' && github.event.inputs.only == ''
        run: |
          set -euo pipefail
          mkdir -p out
          cp -v openwrt/bin/targets/qualcommax/ipq60xx/*.bin out/ || true
          cp -v openwrt/bin/targets/qualcommax/ipq60xx/*manifest* out/ || true
          cp -v openwrt/bin/targets/qualcommax/ipq60xx/sha256sums out/ || true
          cp -v openwrt/bin/targets/qualcommax/ipq60xx/profiles.json out/ || true
          ls -lh out

      - name: 上传 Artifact
        if: steps.up.outputs.skip != 'true' && github.event.inputs.only == ''
        uses: actions/upload-artifact@v4
        with:
          name: ax1800pro-2g-daed-${{ steps.up.outputs.short }}
          path: out/*
          retention-days: 15

      - name: 创建 / 更新 Release
        if: steps.up.outputs.skip != 'true' && github.event.inputs.only == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.up.outputs.tag }}
          SHA: ${{ steps.up.outputs.sha }}
          SHORT: ${{ steps.up.outputs.short }}
          NOTE: ${{ github.event.inputs.note }}
        run: |
          set -euo pipefail
          {
            echo "## 京东云亚瑟 AX1800 Pro（jdcloud,re-ss-01）"
            echo ""
            echo "- 内存：**1GB**（硬改机型，需先刷 1G CDT，否则只认 512MB）"
            echo "- 分区：**rootfs 2048M + HLOS 12M**（对应 \`gpt-JDC_AX1800_Pro_dual-boot_rootfs2048M_HLOS12M_no-last-partition.bin\`）"
            echo "- 代理：内置 **dae + daed**，管理界面 **luci-app-daede**（服务 → daede）"
            echo "- 内核：已开 \`DEBUG_INFO_BTF / BPF_EVENTS / XDP_SOCKETS\`，内核镜像按 12M 分区填充"
            echo "- 默认模式：**旁路由**（LAN 192.168.1.2，网关/DNS 指向 192.168.1.1，DHCP 关闭）"
            echo ""
            echo "### 刷机顺序"
            echo "1. 刷支持 12M 内核的 uboot（\`/big.html\` 可用）"
            echo "2. \`/img.html\` 刷 2048M/HLOS12M GPT 分区表"
            echo "3. 硬改 1G 的机器刷 1G CDT"
            echo "4. \`/big.html\` 刷本 Release 的 \`*-factory.bin\`"
            echo "5. 之后升级用 \`*-sysupgrade.bin\`"
            echo ""
            echo "### 上游"
            echo "- 源码：\`fanchmwrt/fanchmwrt-snapshot\` @ \`fanchmwrt-26.11\`"
            echo "- 提交：\`$SHA\`"
            echo "- 编译时间：$(date -u '+%Y-%m-%d %H:%M UTC')"
            if [ -n "${NOTE:-}" ]; then echo ""; echo "### 备注"; echo "$NOTE"; fi
          } > RELEASE_BODY.md

          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" out/* -R "$GITHUB_REPOSITORY" \
              --title "AX1800Pro 2G daed ($SHORT)" \
              --notes-file RELEASE_BODY.md
          fi
